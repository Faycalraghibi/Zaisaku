services:
  # ---------------------------------------------------------------------------
  # Vector Database (ChromaDB)
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: zaisaku-chromadb
    volumes:
      - chroma-data:/chroma/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - zaisaku-network

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zaisaku-backend
    ports:
      # Expose if you want to reach the API directly bypassing nginx
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENV=prod
      - DOCKER_CONTAINER=1
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LLM_MAX_TOKENS=1024
      - LLM_PROVIDER=${LLM_PROVIDER:-omniroute}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Default to host.docker.internal for host-level services
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OMNIROUTE_BASE_URL=http://host.docker.internal:20128/v1
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-omniroute}
      - OMNIROUTE_MODEL=${OMNIROUTE_MODEL:-auto}
    depends_on:
      - chromadb
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped
    networks:
      - zaisaku-network

  # ---------------------------------------------------------------------------
  # Vue 3 Frontend (Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zaisaku-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - zaisaku-network

volumes:
  chroma-data:
  backend-uploads:

networks:
  zaisaku-network:
    driver: bridge
